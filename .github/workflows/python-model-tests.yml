name: Python Model Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-tests:
    name: Run Python model tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Run readiness model example
        run: python models/readiness_model.py

      - name: Run inventory model example
        run: python models/network_inventory_model.py

      - name: Run change control model example
        run: python models/change_control_model.py

      - name: Run vectorization model example
        run: python models/vectorization_model.py

      - name: Run model package gate example
        run: python models/model_package_gate.py

      - name: Run protection model example
        run: python models/blue_team_protection_model.py

      - name: Run exercise gate example
        run: python models/authorized_exercise_gate.py

      - name: Run observation model example
        run: python models/interference_observation_model.py

      - name: Run EMB3D alignment model example
        run: python models/emb3d_mapping_model.py

      - name: Run pytest
        run: python -m pytest tests/test_readiness_model.py tests/test_network_inventory_model.py tests/test_change_control_model.py tests/test_vectorization_model.py tests/test_model_package_gate.py tests/test_blue_team_protection_model.py tests/test_authorized_exercise_gate.py tests/test_interference_observation_model.py tests/test_emb3d_mapping_model.py

      - name: Write model test summary
        if: always()
        run: |
          echo "## Python Model Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Executed readiness, inventory, change control, vectorization, package gate, defensive protection and EMB3D alignment model validation." >> "$GITHUB_STEP_SUMMARY"
