name: Python Model Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-tests:
    name: Run Python model tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Run model example
        run: python models/readiness_model.py

      - name: Run pytest
        run: python -m pytest tests/test_readiness_model.py

      - name: Write model test summary
        if: always()
        run: |
          echo "## Python Model Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Executed readiness model example and pytest validation." >> "$GITHUB_STEP_SUMMARY"
